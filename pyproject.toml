[tool.pytest.ini_options]
testpaths = ["py/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "-ra"
]
# Every `py/*/tests` directory has an `__init__.py` while its parent does not,
# so importlib mode names them all `tests.conftest` and pytest rejects the
# duplicate. Namespace-package discovery gives each one a unique name.
consider_namespace_packages = true
# Fail fast on a wedged test instead of letting the CI job hang for ~47
# minutes: dump every thread's traceback after 120s and exit the process. The
# slowest legitimate test is ~1.5s, so this only fires on a real stall.
# Complementary shutdown coverage lives in the root `conftest.py`.
faulthandler_timeout = 120
faulthandler_exit_on_timeout = true
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
markers = [
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
asyncio_mode = "auto"

[tool.coverage.run]
# Measure the kontext namespace only, and skip generated code. The schema
# package is emitted by codegen and tracked separately.
source = ["kontext"]
omit = [
    "*/tests/*",
    "py/kontext-schema/*",
]

[tool.coverage.report]
# The minimum overall line coverage required by CI (`coverage` job). This is an
# intentionally conservative floor: it establishes the gate and ratchets upward
# as the test suite grows, rather than failing today's build.
fail_under = 40
show_missing = true
skip_covered = false
