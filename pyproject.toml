    "py/kontext-account",
    "py/kontext-agent",
    "py/kontext-agentic",
    "py/kontext-api",
    "py/kontext-auth",
    "py/kontext-catalog",
    "py/kontext-chat",
    "py/kontext-common",
    "py/kontext-data",
    "py/kontext-engine",
    "py/kontext-file",
    "py/kontext-harness-agno",
    "py/kontext-job",
    "py/kontext-kernel",
    "py/kontext-studio",
    "py/kontext-llm",
    "py/kontext-okf",
    "py/kontext-project",
    "py/kontext-query",
    "py/kontext-runtime",
    "py/kontext-schema",
    "py/kontext-storage",
]

[tool.uv.sources]
kontext-account = { workspace = true }
kontext-agent = { workspace = true }
kontext-agentic = { workspace = true }
kontext-api = { workspace = true }
kontext-auth = { workspace = true }
kontext-catalog = { workspace = true }
kontext-chat = { workspace = true }
kontext-common = { workspace = true }
kontext-data = { workspace = true }
kontext-engine = { workspace = true }
kontext-file = { workspace = true }
kontext-harness-agno = { workspace = true }
kontext-job = { workspace = true }
kontext-kernel = { workspace = true }
kontext-studio = { workspace = true }
kontext-llm = { workspace = true }
kontext-okf = { workspace = true }
kontext-project = { workspace = true }
kontext-query = { workspace = true }
kontext-runtime = { workspace = true }
kontext-schema = { workspace = true }
kontext-storage = { workspace = true }

[dependency-groups]
dev = [
    "commitizen>=4.19.3,<5",
    "fastapi[standard]>=0.162.1,<0.163.0",
    "starlette>=1.10.0,<1.11.0",
    "pytest>=9.2.0,<9.3.0",
    "pytest-asyncio>=1.4.1.post1,<1.5.0",
    "pytest-cov>=7.1.0,<8.0.0",
    # Single exact pin for Ruff. Pre-commit runs `uv run ruff`, so CI and the
    # hook resolve the same version from this file and the lockfile.
    "ruff==0.17.4",
    "pyright>=1.1.390,<2",
    "setuptools>=84.2.1",
]

# Committed-code generators. Kept out of `dev` so a normal `uv sync` does not
# install the codegen toolchain; the generation scripts opt in explicitly with
# `uv run --group codegen`. The exact version is pinned by uv.lock.
codegen = [
    "datamodel-code-generator>=0.90.0,<0.91",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.263.1"
version_scheme = "semver"
tag_format = "ts-packages-v$version"
major_version_zero = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "chore(release): version $current_version -> $new_version"
version_files = [
    "package.json:version",
    "app/package.json:version",
    "docs/user-guide/_meta.json:capturedWith",
    "desktop/src-tauri/Cargo.toml:version",
    "desktop/src-tauri/tauri.conf.json:version",
    "py/kontext-account/pyproject.toml:version",
    "py/kontext-agent/pyproject.toml:version",
    "py/kontext-agentic/pyproject.toml:version",
    "py/kontext-api/pyproject.toml:version",
    "py/kontext-auth/pyproject.toml:version",
    "py/kontext-catalog/pyproject.toml:version",
    "py/kontext-chat/pyproject.toml:version",
    "py/kontext-common/pyproject.toml:version",
    "py/kontext-data/pyproject.toml:version",
    "py/kontext-engine/pyproject.toml:version",
    "py/kontext-file/pyproject.toml:version",
    "py/kontext-harness-agno/pyproject.toml:version",
    "py/kontext-job/pyproject.toml:version",
    "py/kontext-kernel/pyproject.toml:version",
    "py/kontext-studio/pyproject.toml:version",
    "py/kontext-llm/pyproject.toml:version",
    "py/kontext-okf/pyproject.toml:version",
    "py/kontext-project/pyproject.toml:version",
    "py/kontext-query/pyproject.toml:version",
    "py/kontext-runtime/pyproject.toml:version",
    "py/kontext-schema/pyproject.toml:version",
    "py/kontext-storage/pyproject.toml:version",
    "ts/account/package.json:version",
    "ts/app-runtime/package.json:version",
    "ts/auth/package.json:version",
    "ts/build-config/package.json:version",
    "ts/chart/package.json:version",
    "ts/chat/package.json:version",
    "ts/common/package.json:version",
    "ts/event/package.json:version",
    "ts/file/package.json:version",
    "ts/host-api/package.json:version",
    "ts/icons/package.json:version",
    "ts/identity/package.json:version",
    "ts/job/package.json:version",
