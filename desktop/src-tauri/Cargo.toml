[package]
name = "kontext-desktop"
version = "0.263.0"
description = "Kontext Studio desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
