<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontext Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #f7f7f5;
        color: #1c1c1a;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 14px;
        text-align: center;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: #1c1c1a;
        color: #f7f7f5;
        font-size: 26px;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: #6b6b66;
      }
      .bar {
        width: 180px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #deded8;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #1c1c1a;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141413;
          color: #f2f2ee;
        }
        .mark {
          background: #f2f2ee;
          color: #141413;
        }
        p {
          color: #a3a39c;
        }
        .bar {
          background: #30302c;
        }
        .bar span {
          background: #f2f2ee;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">K</div>
      <h1>Kontext Studio</h1>
      <p>Starting your local workspace…</p>
      <div class="bar" role="progressbar" aria-label="Starting"><span></span></div>
    </main>
  </body>
</html>
