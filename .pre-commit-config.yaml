# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
   - repo: https://github.com/pre-commit/pre-commit-hooks
     rev: v6.0.0
     hooks:
        - id: trailing-whitespace
          exclude: ^(ts/schema/src/generated/|py/kontext-schema/src/kontext/schema/_generated/).*
        - id: end-of-file-fixer
          exclude: |
             (?x)^(
                 .*\.md|
                 .*\.json|
                 ts/schema/src/generated/.*|
                 py/kontext-schema/src/kontext/schema/_generated/.*|
                 # Add other patterns to ignore here
             )$
        - id: check-yaml
          exclude: pnpm-lock\.yaml
        - id: check-added-large-files
          args: ["--maxkb=3072"] # Set the maximum file size to 3MB

   - repo: https://github.com/igorshubovych/markdownlint-cli
     rev: v0.49.1
     hooks:
        - id: markdownlint
          args: ["--config", ".markdownlint.json"]
          # Match all markdown files in the repository
          files: \.(md|markdown)$
          # The root CHANGELOG.md is generated by commitizen (`uv run cz bump`)
          # and must not be hand-edited, so lint it in a separate unanchored
          # pattern. Inside the multiline (?x) block below the trailing `$`
          # anchors the whole path, so an alternative there can only ever match
          # a root-level file.
          exclude: |
             (?x)^(
                 ts/schema/src/generated/.*|
                 py/kontext-schema/src/kontext/schema/_generated/.*|
             )$|CHANGELOG\.md$

   - repo: local
     hooks:
       - id: validate-agent-docs
         name: validate agent docs topology
         entry: node tools/validate-agent-docs.mjs
         language: system
         pass_filenames: false
         files: |
            (?x)^(
                AGENTS\.md|
                CLAUDE\.md|
                \.clinerules|
                \.github/copilot-instructions\.md|
                \.github/skills/.*|
                tools/validate-agent-docs\.mjs
            )$

       - id: validate-env-docs
         name: validate environment docs
         entry: node tools/validate-env-docs.mjs
         language: system
         pass_filenames: false
         files: |
            (?x)^(
                docs/development/environment\.md|
                \.env\.example|
                py/kontext-common/src/kontext/common/constants/env_vars\.py|
                tools/validate-env-docs\.mjs
            )$

       - id: regenerate-api-types-reminder
         name: regenerate API types reminder
         # Non-blocking nudge only. Regeneration mutates the working tree, so
         # it is not run here; CI's `generated-code` job is the authority that
         # regenerates and fails on drift.
         verbose: true
         entry: >-
            bash -c "printf '%s\n' 'ts/schema inputs changed. Run pnpm run generate:api-types
            and pnpm run generate:models, then commit the result (CI verifies freshness).' >&2"
         language: system
         pass_filenames: false
         files: |
            (?x)^(
                ts/schema/src/.*\.ts|
                ts/schema/scripts/.*|
                ts/schema/src/schemas/.*|
                ts/schema/package\.json|
                ts/schema/src/generated/.*|
                scripts/generate-api-types\.sh
            )$
         stages: [pre-commit]
       - id: validate-workspace-versions
         name: validate-workspace-versions
         description: Ensure ts/* packages stay in lockstep with [tool.commitizen].
         entry: node tools/validate-workspace-versions.mjs
         language: system
         pass_filenames: false
         files: |
            (?x)^(
                pyproject\.toml|
                package\.json|
                ts/[^/]+/package\.json
            )$
         stages: [pre-commit]
       - id: validate-tool-pins
         name: validate-tool-pins
         description: Keep external tool versions pinned once, or in lockstep across files.
         entry: node tools/validate-tool-pins.mjs
         language: system
         pass_filenames: false
         files: |
            (?x)^(
                pyproject\.toml|
                \.pre-commit-config\.yaml
            )$
         stages: [pre-commit]
       - id: prettier
         name: prettier
         description: Format hand-written TS/TSX/JSON with the root Prettier config.
         entry: pnpm exec prettier --write --ignore-unknown
         language: system
         types_or: [ts, tsx, json]
         exclude: |
            (?x)^(
                ts/schema/src/generated/.*|
                ts/schema/src/schemas/.*|
                app/dist/.*|
                .*\.d\.ts
            )$
         stages: [pre-commit]
       - id: eslint
         name: eslint:lint:fix
         verbose: true
         entry: pnpm lint:fix
         language: system
         pass_filenames: false
         files: \.(js|jsx|ts|tsx)$
         stages: [pre-commit]
       # Ruff runs through the project-pinned binary (uv.lock) rather than a
       # remote pre-commit mirror, so it can never drift from CI's
       # `uv run ruff check` / `uv run ruff format --check`.
       - id: ruff-check
         name: ruff check --fix
         entry: uv run ruff check --fix
         language: system
         types: [python]
         exclude: |
            (?x)^(
                py/kontext-schema/src/kontext/schema/_generated/.*|
            )$
         stages: [pre-commit]
       - id: ruff-format
         name: ruff format
         entry: uv run ruff format
         language: system
         types: [python]
         exclude: |
            (?x)^(
                py/kontext-schema/src/kontext/schema/_generated/.*|
            )$
         stages: [pre-commit]
       - id: pyright
         name: pyright
         entry: bash scripts/run-pyright.sh
         language: system
         files: ^py/.+\.py$
         stages: [pre-commit]
       - id: commitizen-branch
         name: commitizen check branch
         entry: bash scripts/check-commitizen-branch.sh
         language: system
         pass_filenames: false
         always_run: true
         stages: [pre-push]
