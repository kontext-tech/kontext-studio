# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to build (e.g., v1.2.3)."
        required: true
        type: string
      upload_release_asset:
        description: "Upload built artifact as a GitHub Release asset"
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: "22"
  VITE_MODE: production

permissions:
  contents: write

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.event.inputs.version || github.ref_name }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [ -z "$VERSION" ]; then
            echo "❌ Version could not be resolved" >&2
            exit 1
          fi

          # Normalize to v-prefixed tag to align with release assets
          if [[ ! "$VERSION" == v* ]]; then
            VERSION="v$VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building App for version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm --filter @kontext-labs/app exec tsc --noEmit

      - name: Build shared packages
        run: pnpm run build:shared

      - name: Build app application
        env:
          NODE_ENV: production
          # Public runtime URLs are intentionally left empty at build time so the
          # released app-dist.zip does not bake in localhost defaults (the Vite
          # config falls back to localhost only when these are *unset*, not when
          # they are empty). Containerized deploys inject real values at startup
          # via app/docker-entrypoint.sh (window.ENV replacement); see app/README.md.
          PUBLIC_KONTEXT_APP_URL: ""
          PUBLIC_KONTEXT_URL: ""
          PUBLIC_KONTEXT_API_URL: ""
          PUBLIC_KONTEXT_DATA_API_URL: ""
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          export VERSION="${VERSION}"

          pnpm --filter @kontext-labs/app build:prod

          # Replace version placeholders in HTML files (like docker-entrypoint.sh does)
          find app/dist -type f -name "*.html" -exec sed -i "s/%VERSION%/${VERSION}/g" {} \;

      - name: Publish build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app/dist/
          retention-days: 15

      - name: Create zip for GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="app-dist-${VERSION}.zip"
          cd app/dist
          zip -r "../../${ZIP_NAME}" . -q
          cd ../..
          ls -lh "${ZIP_NAME}"

      - name: Ensure GitHub Release exists
        if: github.event_name == 'push' || inputs.upload_release_asset == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "✅ Release $VERSION already exists"
            exit 0
          fi

          echo "Creating draft release $VERSION"
          gh release create "$VERSION" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release $VERSION" \
            --notes "(Draft) Assets generated by build-app workflow" \
            --draft

      - name: Upload GitHub Release asset
        if: github.event_name == 'push' || inputs.upload_release_asset == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="app-dist-${VERSION}.zip"
          echo "Uploading ${ZIP_NAME} to GitHub Release ${VERSION}"
          gh release upload "${VERSION}" "${ZIP_NAME}" --clobber --repo "${GITHUB_REPOSITORY}"
