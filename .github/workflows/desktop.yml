# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Desktop

# Builds the macOS DMGs and the Windows installer and attaches them to an
# existing v<version> release. Dispatch this after the release exists;
# release.yml does that automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build (the v<version> tag must exist)"
        required: true
        type: string
      upload:
        description: "Upload the installers to the GitHub Release"
        required: false
        default: true
        type: boolean
      windowsUpload:
        description: "Upload the Windows installer to the release (download it from the workflow run instead when false)"
        required: false
        default: true
        type: boolean
      ref:
        description: "Optional git ref to build instead of the v<version> tag (test build; nothing is attached to any release)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/uv/**"
      - "py/kontext-studio/**"
      - "py/kontext-runtime/**"
      - "ts/file/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate desktop changes
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure placeholder resources
        run: node desktop/scripts/ensure-resources.mjs
      - name: Rust format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Version lockstep
        run: |
          node -e "const root=require('./package.json').version; const tauri=require('./desktop/src-tauri/tauri.conf.json').version; if(root!==tauri){console.error(root,tauri);process.exit(1)}"
      - name: Frontend bridge lint
        run: pnpm exec eslint ts/file/src/utils/fileUtils.ts

  windows-lint:
    name: Windows Rust lint
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Ensure placeholder resources
        run: node desktop/scripts/ensure-resources.mjs
      - name: Rust format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Windows Rust lint
        shell: bash
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS Intel is blocked: lancedb has no macOS x86_64 wheel.
        # Windows wheels all exist; desktop code paths already carry cfg gates.
        include:
          - arch: arm64
            runner: macos-15
          - arch: win-x64
            runner: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}
      - name: Validate version
        if: inputs.ref == ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$ROOT_VERSION" != "$VERSION" ]; then
            echo "Requested $VERSION but the checkout is $ROOT_VERSION" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Cache python-build-standalone
        uses: actions/cache@v6
        with:
          path: desktop/.cache/python-build-standalone
          key: pbs-${{ runner.os }}-${{ hashFiles('desktop/runtime.lock.json') }}
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm run build:shared
      - name: Assemble bundled Python
        run: uv run python desktop/scripts/assemble.py --arch ${{ matrix.arch }}
      - name: Build desktop app and installer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm run desktop:build
          else
            pnpm run desktop:build:windows
          fi
      - name: Verify bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="desktop/src-tauri/target/release/bundle/macos/Kontext Studio.app"
          codesign --verify --deep --strict --verbose=2 "$APP"

          TMP=$(mktemp -d)
          HOME="$TMP" KONTEXT_LOCAL_WORKER_ENABLED=false \
            "$APP/Contents/Resources/python/bin/python3" -E -s -B -u \
            -m kontext.studio desktop --preferred-port 0 --parent-pid $$ \
            < /dev/zero > "$TMP/ready.log" 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 300); do
            grep -q '@@KONTEXT_READY@@' "$TMP/ready.log" && break
            sleep 0.2
          done
          PORT=$(sed -n 's/^@@KONTEXT_READY@@//p' "$TMP/ready.log" | tail -1 | \
            "$APP/Contents/Resources/python/bin/python3" -c \
            'import json,sys; print(json.load(sys.stdin)["port"])')
          curl -fsS "http://127.0.0.1:${PORT}/health" > /dev/null
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"
          rm -rf "$TMP"
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          EXE="dist/Kontext-Studio-${VERSION}-Windows-x64.exe"
          test -f "$EXE"

          PYTHON="desktop/src-tauri/resources/python/python.exe"
          TMP=$(mktemp -d)
          KONTEXT_LOCAL_WORKER_ENABLED=false \
            "$PYTHON" -E -s -B -u -m kontext.studio desktop \
            --preferred-port 0 --parent-pid $$ \
            < /dev/zero > "$TMP/ready.log" 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 300); do
            grep -q '@@KONTEXT_READY@@' "$TMP/ready.log" && break
            sleep 0.2
          done
          PORT=$(sed -n 's/^@@KONTEXT_READY@@//p' "$TMP/ready.log" | tail -1 | \
            "$PYTHON" -c \
            'import json,sys; print(json.load(sys.stdin)["port"])')
          curl -fsS "http://127.0.0.1:${PORT}/health" > /dev/null
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"
          rm -rf "$TMP"
      - name: Free assembly resources
        shell: bash
        run: rm -rf desktop/src-tauri/resources
      - name: Verify DMG
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DMG="dist/Kontext-Studio-${VERSION}-macOS-${{ matrix.arch }}.dmg"
          test -f "$DMG"
          hdiutil verify "$DMG"
      - uses: actions/upload-artifact@v7
        with:
          name: kontext-desktop-${{ matrix.arch }}
          path: ${{ matrix.arch == 'win-x64' && 'dist/*.exe' || 'dist/*.dmg' }}
          if-no-files-found: error

  release:
    name: Attach installers to release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload && inputs.ref == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kontext-desktop-*
          merge-multiple: true
          path: dist
      - name: Write checksums
        shell: bash
        env:
          WINDOWS_UPLOAD: ${{ inputs.windowsUpload }}
        run: |
          cd dist
          shopt -s nullglob
          if [ "$WINDOWS_UPLOAD" = "true" ]; then
            assets=(*.dmg *.exe)
          else
            assets=(*.dmg)
          fi
          sha256sum "${assets[@]}" > SHA256SUMS-desktop.txt
          cat SHA256SUMS-desktop.txt
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          WINDOWS_UPLOAD: ${{ inputs.windowsUpload }}
        run: |
          cd dist
          shopt -s nullglob
          if [ "$WINDOWS_UPLOAD" = "true" ]; then
            assets=(*.dmg *.exe)
          else
            assets=(*.dmg)
          fi
          gh release upload "v${VERSION}" "${assets[@]}" SHA256SUMS-desktop.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
