# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

# Single, maintainer-dispatched release entry point.
#
#   bump (Commitizen) -> push release branch and open a pull request
#     -> maintainer squash-merges the PR
#     -> re-dispatch with version=<version> to tag the merged commit,
#        create the v<version> GitHub Release, publish docs, and dispatch
#        publish-pypi.yml
#
# This workflow never runs on a push or a merged pull request: merging cannot
# publish an artifact by itself. The tag push to `ts-packages-v*` is what
# publishes the @kontext-tech/* packages, exactly as before.
#
# main is protected and has no bypass actors, so the bump commit must land
# through a pull request like any other change.
#
# Resume paths:
#   - the release PR is open but the squash merge was not done: merge it, then
#     re-dispatch with `version=<version>`.
#   - bump/tag/release succeeded but a publish failed: re-dispatch the failed
#     workflow directly (publish-pypi.yml or publish-docs.yml).
#   - the tag was pushed but the Release was never created: re-dispatch this
#     workflow with `version=<version>` to skip the bump and redo the release.
#
# secrets.PAT_FOR_TAG_PUSH must be a token with contents:write (to push the
# release branch and tags), pull_requests:write (to open the release PR), and
# actions:write (to dispatch publish-pypi.yml). GITHUB_TOKEN cannot open a
# cross-workflow PR here, and pushes it makes do not start other workflows.
#
# Do NOT add `push: tags: ["v*"]`: gh release create without --verify-tag
# creates the tag from --target, so a dispatch is the deliberate act that cuts
# a release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment. Ignored when `version` is set."
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: "Release an already-bumped version, without the leading v (skips the bump)."
        required: false
        type: string
        default: ""
      publish_pypi:
        description: "Dispatch the PyPI wheel publish after the Release exists"
        required: false
        type: boolean
        default: true
      publish_docs:
        description: "Build and publish docs-site to docs.kontext.tech"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false

run-name: "Release ${{ inputs.version || inputs.bump }} by @${{ github.actor }}"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: Bump and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      pr_created: ${{ steps.version.outputs.pr_created }}
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_FOR_TAG_PUSH }}

      - name: Require main and a push token
        env:
          PAT: ${{ secrets.PAT_FOR_TAG_PUSH }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched from main (got $REF)."
            exit 1
          fi
          if [ -z "$PAT" ]; then
            echo "::error::PAT_FOR_TAG_PUSH is required: it opens the release pull request, pushes tags, and dispatches the publish workflow."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          # Release from the tip of origin/main, not from whatever ref the
          # dispatcher had selected.
          git checkout -B main origin/main

      - name: Bump version and prepare release
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PR_CREATED="false"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "::error::version '$INPUT_VERSION' is not a valid semantic version."
              exit 1
            fi
            WORKSPACE_VERSION="$(node -p "require('./package.json').version")"
            if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
              echo "::error::package.json is $WORKSPACE_VERSION but version input is $VERSION."
              exit 1
            fi
            pnpm run validate:workspace-versions
            if git rev-parse -q --verify "refs/tags/ts-packages-v$VERSION" >/dev/null; then
              echo "Releasing existing tag ts-packages-v$VERSION without bumping."
            else
              echo "ts-packages-v$VERSION is missing; tagging the current origin/main tip ($(git rev-parse --short HEAD))."
              git tag "ts-packages-v$VERSION"
              git push origin "ts-packages-v$VERSION"
            fi
          else
            pnpm run validate:workspace-versions
            CURRENT="$(uv run cz version --project)"
            echo "Current version: $CURRENT"

            ARGS=(bump --yes --no-verify)
            if [ "$BUMP" != "auto" ]; then
              ARGS+=(--increment="$BUMP")
            fi

            set +e
            uv run cz "${ARGS[@]}"
            STATUS=$?
            set -e

            case "$STATUS" in
              0)
                VERSION="$(uv run cz version --project)"
                pnpm run validate:workspace-versions
                # cz rewrites the manifests but not uv.lock, which records the
                # workspace versions too; fold the refresh into the release
                # commit so the branch is not left dirty.
                uv lock
                if ! git diff --quiet -- uv.lock; then
                  git add uv.lock
                  git commit --amend --no-edit
                fi
                pnpm run validate:workspace-versions
                # main is protected with no bypass actors, so the bump lands
                # through a pull request. Drop the local tag cz created; the
                # tag is created after the merge by the `version` dispatch.
                git tag -d "ts-packages-v$VERSION" >/dev/null 2>&1 || true
                PR_CREATED="true"
                ;;
              3 | 21)
                echo "::error::No release-worthy commits since ts-packages-v$CURRENT. Only docs/chore commits produce no bump; use 'version' to re-release an existing tag."
                exit 1
                ;;
              7)
                echo "::error::Commitizen could not create the release tag, which usually means it already exists. Re-dispatch with version=<version> to release the existing tag, or remove the stray tag first."
                exit 1
                ;;
              *)
                echo "::error::cz bump failed with exit code $STATUS."
                exit "$STATUS"
                ;;
            esac
          fi

          if [ "$PR_CREATED" = "true" ]; then
            BRANCH="release/v$VERSION"
            # The branch is disposable; force-pushing makes a retried run
            # replace the previous attempt instead of failing on divergence.
            git push --force origin "HEAD:refs/heads/$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr_created=$PR_CREATED" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Extract the body of the section whose heading contains the version.
          awk -v version="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, version)) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION." > release-notes.md
          fi
          echo "" >> release-notes.md
          echo "Install with: \`uv tool install kontext-studio==${VERSION}\`" >> release-notes.md
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

      - name: Open release pull request
        id: pr
        if: steps.version.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TAG_PUSH }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            {
              echo "Automated release bump for v$VERSION."
              echo
              echo "Merge with **Squash and merge**, then re-dispatch **Release**"
              echo "with \`version=$VERSION\` to tag the merge commit and publish."
              echo
              cat release-notes.md
            } > pr-body.md
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$BRANCH" \
              --title "chore(release): version $VERSION" \
              --body-file pr-body.md)"
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Release pull request ready"
            echo
            echo "Merge $PR_URL with **Squash and merge**, then re-dispatch"
            echo "**Release** with \`version=$VERSION\` to tag and publish."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: prepare
    if: needs.prepare.outputs.pr_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TAG_PUSH }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes-file release-notes.md
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest --notes-file release-notes.md
            fi
          else
            args=(
              "$TAG"
              --title "Kontext $VERSION"
              --notes-file release-notes.md
            )
            # --target creates the tag, but fails when the tag already exists
            # (for example, a release that was deleted after its tag was cut).
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              args+=(--verify-tag)
            else
              args+=(--target "$SHA")
            fi
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh release create "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi

  publish-docs:
    name: Publish Docs
    needs: [prepare, release]
    if: needs.prepare.outputs.pr_created != 'true' && inputs.publish_docs
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish-pypi:
    name: Dispatch PyPI publish
    needs: [prepare, release]
    if: needs.prepare.outputs.pr_created != 'true' && inputs.publish_pypi
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish-pypi.yml
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_TAG_PUSH }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # publish-pypi.yml must stay the top-level workflow named in the PyPI
          # trusted-publisher config, so it cannot be a workflow_call callee.
          gh workflow run publish-pypi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target=pypi \
            -f "version=$VERSION" \
            -f "confirm=$VERSION"

          # This job has no checkout, so gh cannot infer the repository; without
          # --repo the lookup aborts under `set -e` and fails an otherwise
          # successful dispatch.
          for _ in $(seq 1 10); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-pypi.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
            if [ -n "$RUN_ID" ]; then
              echo "Started PyPI publish: ${{ github.server_url }}/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
              exit 0
            fi
            sleep 3
          done
          echo "::warning::publish-pypi.yml was dispatched but no run has appeared yet; check the Actions tab."
