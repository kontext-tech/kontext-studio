# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Create GitHub Release

# Dispatch-only. Creates or promotes the v<version> GitHub Release; it does not
# build the wheel. publish-pypi.yml owns the single wheel build: it verifies,
# checksums, smoke-tests, publishes to PyPI, then attaches the wheel and
# SHA256SUMS to this release. One build per release, and nothing reaches PyPI
# before the release exists.
#
# Intended sequence:
#
#   1. dispatch this workflow       -> validates version/tag, creates or promotes
#                                      the GitHub Release, and (by default)
#                                      publishes the docs site
#   2. dispatch publish-pypi.yml    -> target=pypi, version=<version>,
#                                      confirm=<version>; publishes and attaches
#                                      the assets
#
# Docs are published by calling publish-docs.yml as a reusable workflow rather
# than relying on a tag push event: tags created by gh release create with
# GITHUB_TOKEN do not start new workflow runs.
#
# Do NOT add `push: tags: ["v*"]`: gh release create without --verify-tag
# creates the tag from --target, so a dispatch is the deliberate act that cuts
# a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g., 0.261.0)"
        required: true
        type: string
      release_tag:
        description: "GitHub Release tag to create or update (e.g., v0.261.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false
      publish_docs:
        description: "Build and publish docs-site to docs.kontext.tech"
        required: false
        type: boolean
        default: true

concurrency: release-${{ inputs.release_tag }}

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Verify release tag matches version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$RELEASE_TAG" != "v${VERSION}" ]; then
            echo "::error::release_tag '$RELEASE_TAG' must be 'v${VERSION}'"
            exit 1
          fi
          echo "Release tag matches version: $RELEASE_TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$RELEASE_TAG" --prerelease
            else
              gh release edit "$RELEASE_TAG" --latest
            fi
          else
            args=(
              "$RELEASE_TAG"
              --target "$GITHUB_SHA"
              --title "Kontext $VERSION"
              --notes "Kontext $VERSION. Install with: uv tool install \"kontext-labs @ https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/kontext_labs-${VERSION}-py3-none-any.whl\""
            )
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi
            gh release create "${args[@]}"
          fi

  publish-docs:
    name: Publish Docs
    needs: release
    if: inputs.publish_docs
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
