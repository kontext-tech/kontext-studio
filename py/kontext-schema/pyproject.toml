[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-schema"
version = "0.263.0"
description = "Pydantic models for Kontext, generated from OpenAPI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = ["kontext", "schemas", "pydantic", "models"]
dependencies = [
  "pydantic>=2.14.1,<3.0.0",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/kontext",
  "/README.md",
]
