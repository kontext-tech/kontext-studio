[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-job"
version = "0.263.1"
description = "Job framework and execution orchestration for Kontext"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-auth",
    "kontext-common",
    "kontext-data",
    "kontext-kernel",
    "croniter>=6.0.0,<7.0.0",
    "duckdb>=2.0.0",
    # DuckDB requires pytz to return TIMESTAMPTZ values (e.g. current_timestamp).
    "pytz>=2025.2",
    "openpyxl>=3.1.0",
    "pydantic>=2.14.3,<3.0.0",
    "kontext-schema",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]
catalog = [
    "lancedb>=0.39.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
