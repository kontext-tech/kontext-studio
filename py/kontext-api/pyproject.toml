[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-api"
version = "0.263.0"
description = "Unified FastAPI application for Kontext Data & AI APIs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi[standard]>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "kontext-account",
    "kontext-agent",
    "kontext-chat",
    "kontext-auth",
    "kontext-catalog",
    "kontext-common",
    "kontext-data",
    "kontext-storage",
    "kontext-file",
    "kontext-harness-agno",
    "kontext-project",
    "kontext-execution",
    "kontext-query",
    "kontext-engine",
    "kontext-runtime",
    "kontext-job[catalog]",
    "kontext-llm",
    "kontext-agentic[inprocess]",
    "kontext-okf",
    "kontext-schema",
    "pydantic>=2.14.1,<3.0.0",
    "pyjwt[crypto]>=2.10.0",
    # Helpful for local/dev env var loading parity
    "python-multipart>=0.0.9",
    "greenlet>=3.5.6",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[project.scripts]
kontext-api = "kontext.api.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.17.2",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
