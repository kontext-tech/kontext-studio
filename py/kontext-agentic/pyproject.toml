[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-agentic"
version = "0.261.0"
description = "Agentic application layer for Kontext: agent blueprints, domain tools, and the chat workflow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
keywords = ["kontext", "agentic", "agents", "blueprints", "chat", "platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "kontext-agent",
    "kontext-catalog",
    "kontext-chat",
    "kontext-common",
    "kontext-data",
    "kontext-execution",
    "kontext-file",
    "kontext-llm",
    "kontext-schema",
    "mistune>=3.4.0",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[project.optional-dependencies]
inprocess = [
    "kontext-common",
    "kontext-data",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]
