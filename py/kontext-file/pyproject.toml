[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-file"
version = "0.263.1"
description = "File domain package for Kontext"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-auth",
    "kontext-catalog",
    "kontext-common",
    "kontext-data",
    "kontext-execution",
    "kontext-job",
    "kontext-schema",
    "kontext-storage",
    "pyarrow>=26.0.0",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
