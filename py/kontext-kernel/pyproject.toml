[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-kernel"
version = "0.261.2"
description = "Separate-process Python execution topology for Kontext"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-common",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
