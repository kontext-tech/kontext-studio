[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-okf"
version = "0.261.0"
description = "Open Knowledge Format (OKF v0.2) canonical concept model and bundle I/O for Kontext"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-common",
    "pydantic>=2.14.1,<3.0.0",
    "pyyaml>=6.0.0",
    "kontext-schema",
]

[project.urls]
Repository = "https://github.com/kontext-labs/kontext-labs"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
