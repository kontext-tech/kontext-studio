[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-account"
version = "0.264.0"
description = "Account and local identity services for Kontext"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-common",
    "kontext-data",
    "kontext-llm",
    "kontext-schema",
    "pydantic>=2.14.3,<3.0.0",
    "sqlalchemy>=2.1.6",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
