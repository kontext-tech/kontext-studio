[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-harness-agno"
version = "0.265.1"
description = "Agno harness adapter for Kontext agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-agent",
    "kontext-common",
    "kontext-llm",
    "kontext-schema",
    # Core SDKs only: the OpenAI-compatible family (openai, azure, deepseek,
    # openrouter, openai_compatible), Anthropic, and local Ollama/LM Studio.
    # Bedrock, Gemini, and Mistral SDKs are opt-in extras so distributions
    # ship lean; their factories degrade to a clear "install the extra" error.
    "agno[anthropic,lmstudio,ollama,openai]>=3.2.1",
]

[project.optional-dependencies]
bedrock = ["agno[aws-bedrock]"]
gemini = ["agno[google]"]
mistral = ["agno[mistral]"]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[project.entry-points."kontext.agent_harnesses"]
agno = "kontext.harness.agno.factory:AgnoAgentFrameworkAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]
