[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-harness-agno"
version = "0.261.1"
description = "Agno harness adapter for Kontext agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-agent",
    "kontext-common",
    "kontext-llm",
    "kontext-schema",
    "agno[anthropic,aws,azure,google,lmstudio,mistral,ollama,openai]>=3.1.10",
]

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[project.entry-points."kontext.agent_harnesses"]
agno = "kontext.harness.agno.factory:AgnoAgentFrameworkAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]
