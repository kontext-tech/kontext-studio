[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kontext-common"
version = "0.264.0"
description = "Shared contracts and cross-cutting primitives for Kontext Python components"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "croniter>=6.0.0,<7.0.0",
    "kontext-schema",
    "pydantic>=2.14.3,<3.0.0",
    "pydantic-settings>=2.16.0",
    "python-json-logger>=2.0.7",
]

[project.entry-points.pytest11]
kontext_settings_isolation = "kontext.common.pytest_plugin"

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
