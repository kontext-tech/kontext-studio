[project]
name = "kontext-studio"
version = "0.263.0"
description = "Local-first AI data workspace: server, CLI, and runtime"
authors = [
    { name = "Kontext Team", email = "hello@kontext.tech" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kontext-account",
    "kontext-auth",
    "kontext-common",
    "kontext-data",
    "kontext-storage",
    "kontext-engine",
    "kontext-execution",
    "kontext-kernel",
    "kontext-runtime",
    "kontext-job",
    "kontext-project",
    "kontext-api",
    "kontext-agentic[inprocess]",
    "kontext-harness-agno",
    "kontext-schema",
    "fastapi[standard]>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "rich>=15.0.0",
    "pyfiglet>=1.0.0",
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/kontext-tech/kontext-studio"

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.scripts]
kontext = "kontext.labs.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kontext"]
